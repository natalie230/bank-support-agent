<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank support desk</title>
<style>
  :root { color-scheme: light dark; --line: #8884; }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; } h2 { font-size: 1rem; margin-top: 1.5rem; }
  nav { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
  nav button[aria-current="true"] { font-weight: 600; text-decoration: underline; }
  label { display: block; margin: .6rem 0; }
  input, select, textarea, button { font: inherit; padding: .35rem; }
  input, select, textarea { width: 100%; box-sizing: border-box; }
  label.inline { display: flex; gap: .4rem; align-items: center; }
  label.inline input { width: auto; }
  button { width: auto; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid var(--line); }
  .card { border: 1px solid var(--line); border-radius: .4rem; padding: .75rem; margin: .75rem 0; }
  .err { color: #c00; } .muted { opacity: .65; }
  .tag { border: 1px solid var(--line); border-radius: 1rem; padding: 0 .5rem; font-size: .85em; }
  .urgent { color: #c60; font-weight: 600; }
</style>

<h1>Bank support desk</h1>
<nav>
  <button data-tab="customer" aria-current="true">Raise a ticket</button>
  <button data-tab="desk">Agent desk</button>
</nav>

<section id="customer">
  <form id="raise">
    <label>Your name <input name="name" required maxlength="100"></label>
    <label>Email <input name="email" type="email" required></label>
    <label>Language <select name="language_id" required></select></label>
    <label>What do you need help with?
      <select name="skill_ids" multiple required size="4"></select></label>
    <label class="inline"><input type="checkbox" name="urgent"> This is urgent</label>
    <label>Describe the problem <textarea name="description" rows="3"></textarea></label>
    <button>Raise ticket</button>
  </form>
  <div id="raised"></div>
</section>

<section id="desk" hidden>
  <label>You are <select id="who"></select></label>
  <div id="me" class="muted">Pick an agent to start.</div>
  <div id="held"></div>
  <h2>Waiting room</h2>
  <div id="queue" class="muted">&hellip;</div>
</section>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

async function api(path, body, method = "POST") {
  const r = await fetch(path, body === undefined ? undefined : {
    method, headers: { "content-type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(
    typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail));
  return data;
}

const waited = iso => {
  const s = (Date.now() - new Date(iso)) / 1000;
  return s < 90 ? Math.round(s) + "s" : Math.round(s / 60) + "m";
};

let skillName = {}, myTicket = null, autoClaim = false;

// ---- tabs -------------------------------------------------------------
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(o =>
    o.setAttribute("aria-current", String(o === b)));
  $("#customer").hidden = b.dataset.tab !== "customer";
  $("#desk").hidden = b.dataset.tab !== "desk";
  tick();
});

// ---- customer ---------------------------------------------------------
$("#raise").onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    const customer = await api("/customers",
      { name: f.get("name"), email: f.get("email") });
    myTicket = await api("/tickets", {
      customer_id: customer.id,
      language_id: +f.get("language_id"),
      skill_ids: f.getAll("skill_ids").map(Number),
      urgency: f.get("urgent") ? "high" : "normal",
      description: f.get("description"),
    });
    e.target.reset();
    showTicket();
  } catch (err) {
    $("#raised").innerHTML = '<p class="err">' + esc(err.message) + "</p>";
  }
};

function showTicket() {
  const t = myTicket;
  const where = { open: "waiting for an agent", in_chat: "an agent is with you now",
                  closed: "closed" }[t.status];
  $("#raised").innerHTML = '<div class="card"><b>Ticket #' + t.id + "</b> — " + where +
    '<div class="muted">' + (esc(t.description) || "<i>no description</i>") + "</div></div>";
}

// ---- agent desk -------------------------------------------------------
$("#who").onchange = () => { $("#held").innerHTML = ""; tick(); };

function ticketBits(t) {
  return (t.urgency === "high" ? '<span class="urgent">urgent</span> ' : "") +
    t.skill_ids.map(s => '<span class="tag">' + esc(skillName[s]) + "</span>").join(" ");
}

async function renderDesk() {
  const id = +$("#who").value;
  if (!id) return;
  const me = await api("/agents/" + id + "/status");
  const busy = me.active_ticket_ids.length;
  const idle = me.status !== "available" || busy >= me.capacity;
  $("#me").innerHTML = '<div class="card"><b>' + esc(me.name) + "</b> — " + me.status +
    ", " + busy + "/" + me.capacity + " in chat" +
    '<p><button id="toggle">Go ' +
      (me.status === "available" ? "unavailable" : "available") + "</button> " +
    '<button id="claim"' + (idle ? " disabled" : "") + ">Claim next</button> " +
    '<label class="inline"><input type="checkbox" id="auto"> keep claiming</label></p></div>';
  $("#auto").checked = autoClaim;
  $("#auto").onchange = e => { autoClaim = e.target.checked; };
  $("#toggle").onclick = async () => {
    await api("/agents/" + id + "/status",
      { status: me.status === "available" ? "unavailable" : "available" }, "PUT");
    tick();
  };
  $("#claim").onclick = async () => {
    const t = await api("/agents/" + id + "/claim", {});
    if (!t) $("#held").insertAdjacentHTML("beforeend",
      '<p class="muted">Nothing claimable right now.</p>');
    tick();
  };

  const held = await Promise.all(
    me.active_ticket_ids.map(t => api("/tickets/" + t)));
  $("#held").innerHTML = held.map(t => '<div class="card"><b>#' + t.id + " " +
    esc(t.customer_name) + "</b> " + ticketBits(t) +
    "<p>" + (esc(t.description) || '<i class="muted">no description</i>') + "</p>" +
    '<button data-close="' + t.id + '">Close chat</button></div>').join("");
  $("#held").querySelectorAll("[data-close]").forEach(b => b.onclick = async () => {
    await api("/tickets/" + b.dataset.close + "/close", { closed_by: id }, "PUT");
    tick();
  });
}

async function renderQueue() {
  const q = await api("/queue");
  $("#queue").innerHTML = q.length === 0 ?
    '<p class="muted">Waiting room is empty.</p>' :
    "<table><tr><th>#<th>Customer<th>Needs<th>Waiting</tr>" + q.map(t =>
      "<tr><td>" + t.id + "<td>" + esc(t.customer_name) +
      "<td>" + ticketBits(t) + "<td>" + waited(t.created_at) + "</tr>").join("") +
    "</table>";
}

// ---- polling ----------------------------------------------------------
// ponytail: one timer for the whole page, because ADR 0001 made claiming a
// poll. The desk is a handful of people, not a stadium -- if that stops being
// true, this is where server-sent events go.
async function tick() {
  try {
    if (!$("#customer").hidden && myTicket) {
      myTicket = await api("/tickets/" + myTicket.id);
      showTicket();
    }
    if (!$("#desk").hidden) {
      const id = +$("#who").value;
      if (autoClaim && id) await api("/agents/" + id + "/claim", {});
      await renderDesk();
      await renderQueue();
    }
  } catch (err) {
    console.error(err);
  }
}

(async () => {
  const [skills, languages, agents] = await Promise.all(
    [api("/skills"), api("/languages"), api("/agents")]);
  skillName = Object.fromEntries(skills.map(s => [s.id, s.name]));
  const options = rows => rows.map(r =>
    '<option value="' + r.id + '">' + esc(r.name) + "</option>").join("");
  $("[name=language_id]").innerHTML = options(languages);
  $("[name=skill_ids]").innerHTML = options(skills);
  $("#who").innerHTML = '<option value="">— pick an agent —</option>' + options(agents);
  setInterval(tick, 2000);
})();
</script>
